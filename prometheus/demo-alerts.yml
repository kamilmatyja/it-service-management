groups:
  - name: shop-symptoms
    rules:
      - alert: CheckoutErrorRateHigh
        expr: >-
          sum(rate(traces_span_metrics_calls_total{service_name="checkout", span_kind="SPAN_KIND_SERVER", status_code="STATUS_CODE_ERROR"}[5m])) 
          / sum(rate(traces_span_metrics_calls_total{service_name="checkout", span_kind="SPAN_KIND_SERVER"}[5m])) > 0.05
        for: 1m
        labels:
          service: checkout
          severity: P1
      - alert: CheckoutLatencyHigh
        expr: histogram_quantile(0.99, sum by (le) (rate(traces_span_metrics_duration_milliseconds_bucket{service_name="checkout", span_kind="SPAN_KIND_SERVER"}[5m]))) > 2000
        for: 1m
        labels:
          service: checkout
          severity: P2